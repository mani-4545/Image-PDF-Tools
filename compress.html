<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compress Image - ImageTools</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            Image<span>Tools</span>
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="index.html#tools">Tools</a>
            <a href="index.html#about">About</a>

        </div>

    </nav>


    <section class="hero">

        <h1>💾 Compress Image</h1>

        <p>
            Reduce your image file size while maintaining good quality.
        </p>

    </section>


    <main>

        <div class="tool-card">

            <h2>Select Image</h2>

            <p>
                Choose an image and adjust the compression quality.
            </p>

            <br>

            <input
                type="file"
                id="compressInput"
                accept="image/*"
            >

            <br><br>

            <div id="fileInfo"></div>

            <br>

            <label>Image Quality</label>

            <br><br>

            <input
                type="range"
                id="qualityInput"
                min="10"
                max="100"
                value="70"
            >

            <span id="qualityValue">70%</span>

            <br><br>

            <button onclick="compressImage()">
                Compress & Download
            </button>

            <br><br>

            <div id="result"></div>

        </div>

    </main>


    <script src="compress.js"></script>

</body>

</html>
